  <style>

    :root {
      --bg: #fafaf8;
      --text: #222222;
      --muted: #666666;
      --border: #e7e7e7;

      --accent: #FFD000;
      --accent-hover: #E6BB00;

      --radius: 14px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);

      font-family: "IBM Plex Sans JP", sans-serif;

      -webkit-font-smoothing: antialiased;
      line-height: 1.8;
    }

    main {
      max-width: 480px;

      margin: 0 auto;

      padding:
        48px
        24px
        72px;
    }

    .hero {
      text-align: center;
    }

    .avatar {
      width: 100px;
      height: 100px;

      display: block;

      margin: 0 auto 20px;

      border-radius: 50%;
    }

    h1 {
      margin: 0;

      font-size: 2rem;
      font-weight: 700;
      line-height: 1.2;
    }

    .tagline {
      margin-top: 16px;

      color: var(--muted);
      font-size: 1rem;
    }

    .links {
      margin-top: 32px;

      display: flex;
      flex-direction: column;

      gap: 12px;
    }

    .button,
    .link-button {
      display: block;

      width: 100%;

      text-align: center;

      text-decoration: none;

      border-radius: var(--radius);

      padding: 15px 20px;

      transition: .2s ease;

      font-weight: 600;
    }

    .button-primary {
      background: var(--accent);
      color: #222222;
      padding: 18px 20px;
    }

    .button-primary:hover {
      background: var(--accent-hover);
    }

    .button-secondary {
      background: transparent;

      border: 1px solid var(--accent);

      color: var(--text);
    }

    .button-secondary:hover {
      background: rgba(255, 208, 0, .08);
    }

    .link-button {
      color: var(--text);

      background: white;

      border: 1px solid var(--border);
    }

    .link-button:hover {
      border-color: var(--accent);
    }

    .brand {
      margin-top: 40px;

      text-align: center;
    }

    .brand img {
      width: 80px;

      opacity: .75;
    }

    .brand p {
      margin-top: 12px;

      color: var(--muted);

      font-size: .95rem;

      line-height: 1.8;
    }

    footer {
      margin-top: 16px;

      text-align: center;

      color: var(--muted);

      font-size: .85rem;
    }

  </style>

</head>

<body>

<main>

  <section class="hero">

    <img
      src="assets/avatar.png"
      alt="アレくとーる"
      class="avatar">

    <h1>アレくとーる@A'sKey</h1>

    <p class="tagline">
      日本語配列ユーザー向けの<br>
      自作キーボードを設計・頒布しています。
    </p>

  </section>

  <section class="links">

    <a
      href="https://alektor.booth.pm/"
      target="_blank"
      rel="noopener noreferrer"
      class="button button-primary">
      BOOTH
    </a>

    <a
      href="https://alektor.hatenablog.com/entry/2025/03/16/001631"
      target="_blank"
      rel="noopener noreferrer"
      class="button button-secondary">
      ビルドガイド一覧
    </a>

    <a
      href="https://x.com/alektor_diy"
      target="_blank"
      rel="noopener noreferrer"
      class="link-button">
      X（旧Twitter）
    </a>

    <a
      href="https://alektor.hatenablog.com/"
      target="_blank"
      rel="noopener noreferrer"
      class="link-button">
      はてなブログ
    </a>

    <a
      href="https://github.com/alektor-diy"
      target="_blank"
      rel="noopener noreferrer"
      class="link-button">
      GitHub
    </a>

  </section>

  <section class="brand">

    <p>
      自分が使いたいキーボードを形にしながら、日本語配列ユーザーの選択肢を増やしたいと考えています。
    </p>

  </section>

  <footer>
    © A'sKey
  </footer>

</main>

</body>
</html>
