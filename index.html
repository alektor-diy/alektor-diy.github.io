  <style>
    :root {
      --bg: #fafaf8;
      --text: #222222;
      --muted: #666666;
      --border: #e6e6e6;
      --accent: #d9a441;
      --accent-hover: #c6912d;
      --card: #ffffff;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "IBM Plex Sans JP", sans-serif;
      line-height: 1.8;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }

    .hero {
      text-align: center;
    }

    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      display: block;
      margin: 0 auto 24px;
    }

    h1 {
      margin: 0;
      font-size: 2rem;
      font-weight: 700;
      line-height: 1.2;
    }

    .tagline {
      margin-top: 20px;
      color: var(--muted);
      font-size: 1rem;
    }

    .brand-logo {
      width: 220px;
      max-width: 80%;
      display: block;
      margin: 32px auto;
    }

    .cta-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 32px;
    }

    .button {
      display: block;
      width: 100%;
      text-align: center;
      text-decoration: none;
      padding: 14px 20px;
      border-radius: 14px;
      font-weight: 600;
      transition: 0.2s ease;
    }

    .button-primary {
      background: var(--accent);
      color: white;
    }

    .button-primary:hover {
      background: var(--accent-hover);
    }

    .button-secondary {
      border: 1px solid var(--border);
      color: var(--text);
      background: white;
    }

    .button-secondary:hover {
      border-color: var(--accent);
    }

    .divider {
      margin: 48px 0;
      border: none;
      border-top: 1px solid var(--border);
    }

    .statement {
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link-card {
      display: block;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      text-decoration: none;
      color: var(--text);
      font-weight: 500;
      transition: 0.2s ease;
    }

    .link-card:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    footer {
      margin-top: 48px;
      text-align: center;
      color: var(--muted);
      font-size: 0.875rem;
      padding-bottom: 24px;
    }

    @media (min-width: 640px) {
      .cta-group {
        flex-direction: row;
      }

      .button {
        flex: 1;
      }
    }
  </style>

</head>
